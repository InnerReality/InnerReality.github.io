<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="vimBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#231e3d"/>
      <stop offset="100%" style="stop-color:#1e1c31"/>
    </linearGradient>
    <linearGradient id="nanoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#f8fafc" rx="16"/>

  <!-- Vim Window (left) — starts at X=205, width=175 -->
  <g transform="translate(205, 50)" filter="url(#shadow)">
    <!-- Window chrome -->
    <rect x="0" y="0" width="175" height="160" rx="6" fill="#12101e"/>
    <rect x="0" y="0" width="175" height="22" rx="6" fill="#12101e"/>
    <rect x="0" y="11" width="175" height="11" fill="#12101e"/>
    <!-- Traffic lights -->
    <circle cx="14" cy="11" r="4" fill="#ff5f57"/>
    <circle cx="27" cy="11" r="4" fill="#febc2e"/>
    <circle cx="40" cy="11" r="4" fill="#28c840"/>
    <!-- Tab -->
    <rect x="55" y="5" width="75" height="12" rx="3" fill="#1e1c31"/>
    <text x="92" y="14" text-anchor="middle" fill="#cbe3e7" font-size="7" font-family="monospace">~/.vimrc</text>

    <!-- Editor area -->
    <rect x="0" y="22" width="175" height="126" fill="url(#vimBg)"/>
    <!-- Line numbers -->
    <text x="10" y="38" fill="#3e3a5c" font-size="8" font-family="monospace">1</text>
    <text x="10" y="50" fill="#3e3a5c" font-size="8" font-family="monospace">2</text>
    <text x="10" y="62" fill="#3e3a5c" font-size="8" font-family="monospace">3</text>
    <text x="10" y="74" fill="#3e3a5c" font-size="8" font-family="monospace">4</text>
    <text x="10" y="86" fill="#3e3a5c" font-size="8" font-family="monospace">5</text>
    <text x="10" y="98" fill="#3e3a5c" font-size="8" font-family="monospace">6</text>
    <text x="10" y="110" fill="#3e3a5c" font-size="8" font-family="monospace">7</text>
    <!-- Code (Embark theme colors) -->
    <text x="24" y="38" fill="#c792ea" font-size="8" font-family="monospace">call</text>
    <text x="44" y="38" fill="#82aaff" font-size="8" font-family="monospace">plug</text>
    <text x="66" y="38" fill="#cbe3e7" font-size="8" font-family="monospace">#begin()</text>
    <text x="24" y="50" fill="#82aaff" font-size="8" font-family="monospace">Plug</text>
    <text x="44" y="50" fill="#c3e88d" font-size="8" font-family="monospace">'embark-theme/vim'</text>
    <text x="24" y="62" fill="#c792ea" font-size="8" font-family="monospace">call</text>
    <text x="44" y="62" fill="#82aaff" font-size="8" font-family="monospace">plug</text>
    <text x="66" y="62" fill="#cbe3e7" font-size="8" font-family="monospace">#end()</text>
    <text x="24" y="74" fill="#5c6773" font-size="8" font-family="monospace">""</text>
    <text x="36" y="74" fill="#5c6773" font-size="8" font-family="monospace">Colorscheme</text>
    <text x="24" y="86" fill="#82aaff" font-size="8" font-family="monospace">colorscheme</text>
    <text x="78" y="86" fill="#ffcb6b" font-size="8" font-family="monospace">embark</text>
    <text x="24" y="98" fill="#82aaff" font-size="8" font-family="monospace">set</text>
    <text x="40" y="98" fill="#f07178" font-size="8" font-family="monospace">number</text>
    <text x="24" y="110" fill="#82aaff" font-size="8" font-family="monospace">set</text>
    <text x="40" y="110" fill="#f07178" font-size="8" font-family="monospace">tabstop</text>
    <text x="78" y="110" fill="#f78c6c" font-size="8" font-family="monospace">=4</text>
    <!-- Cursor line highlight -->
    <rect x="0" y="68" width="175" height="12" fill="#2a2441" opacity="0.5"/>
    <!-- Vim mode indicator -->
    <rect x="0" y="136" width="175" height="12" fill="#12101e"/>
    <rect x="2" y="137" width="38" height="9" rx="2" fill="#c792ea"/>
    <text x="6" y="145" fill="#1e1c31" font-size="7" font-weight="700" font-family="monospace">INSERT</text>
    <text x="130" y="145" fill="#5c6773" font-size="7" font-family="monospace">-- INSERT --</text>
  </g>

  <!-- Label: Vim -->
  <text x="292" y="225" text-anchor="middle" fill="#3e3a5c" font-size="11" font-weight="700">Vim</text>


  <!-- Nano Window (right) — ends at X=595, width=175 -->
  <g transform="translate(420, 50)" filter="url(#shadow)">
    <!-- Window chrome -->
    <rect x="0" y="0" width="175" height="160" rx="6" fill="#252525"/>
    <rect x="0" y="0" width="175" height="22" rx="6" fill="#252525"/>
    <rect x="0" y="11" width="175" height="11" fill="#252525"/>
    <!-- Traffic lights -->
    <circle cx="14" cy="11" r="4" fill="#ff5f57"/>
    <circle cx="27" cy="11" r="4" fill="#febc2e"/>
    <circle cx="40" cy="11" r="4" fill="#28c840"/>
    <!-- Tab -->
    <rect x="55" y="5" width="75" height="12" rx="3" fill="#333"/>
    <text x="92" y="14" text-anchor="middle" fill="#e0e0e0" font-size="7" font-family="monospace">config.nanorc</text>

    <!-- Editor area -->
    <rect x="0" y="22" width="175" height="126" fill="url(#nanoBg)"/>
    <!-- Code (One Dark-style) -->
    <text x="8" y="38" fill="#e06c75" font-size="8" font-family="monospace">set</text>
    <text x="26" y="38" fill="#d19a66" font-size="8" font-family="monospace">tabsize</text>
    <text x="62" y="38" fill="#98c379" font-size="8" font-family="monospace">4</text>
    <text x="8" y="50" fill="#e06c75" font-size="8" font-family="monospace">set</text>
    <text x="26" y="50" fill="#d19a66" font-size="8" font-family="monospace">const</text>
    <text x="52" y="50" fill="#98c379" font-size="8" font-family="monospace">linenumbers</text>
    <text x="8" y="62" fill="#e06c75" font-size="8" font-family="monospace">set</text>
    <text x="26" y="62" fill="#d19a66" font-size="8" font-family="monospace">const</text>
    <text x="52" y="62" fill="#98c379" font-size="8" font-family="monospace">mouse</text>
    <text x="8" y="74" fill="#e06c75" font-size="8" font-family="monospace">set</text>
    <text x="26" y="74" fill="#d19a66" font-size="8" font-family="monospace">const</text>
    <text x="52" y="74" fill="#98c379" font-size="8" font-family="monospace">smarthome</text>
    <text x="8" y="86" fill="#5c6773" font-size="8" font-family="monospace">##</text>
    <text x="20" y="86" fill="#5c6773" font-size="8" font-family="monospace">Syntax</text>
    <text x="8" y="98" fill="#e06c75" font-size="8" font-family="monospace">include</text>
    <text x="42" y="98" fill="#c678dd" font-size="8" font-family="monospace">"nanorc/*.nanorc"</text>
    <text x="8" y="110" fill="#e06c75" font-size="8" font-family="monospace">set</text>
    <text x="26" y="110" fill="#d19a66" font-size="8" font-family="monospace">const</text>
    <text x="52" y="110" fill="#98c379" font-size="8" font-family="monospace">titlecolor</text>
    <text x="98" y="110" fill="#61afef" font-size="8" font-family="monospace">green</text>
    <!-- Cursor line highlight -->
    <rect x="0" y="44" width="175" height="12" fill="#2a2a2a" opacity="0.5"/>
    <!-- Nano bottom bar -->
    <rect x="0" y="136" width="175" height="12" fill="#007acc"/>
    <text x="6" y="145" fill="#ffffff" font-size="7" font-family="monospace">^G Help</text>
    <text x="50" y="145" fill="#ffffff" font-size="7" font-family="monospace">^O Write</text>
    <text x="104" y="145" fill="#ffffff" font-size="7" font-family="monospace">^X Exit</text>
  </g>

  <!-- Label: Nano -->
  <text x="507" y="225" text-anchor="middle" fill="#3e3a5c" font-size="11" font-weight="700">Nano</text>

  <!-- Bottom tagline -->
  <text x="400" y="250" text-anchor="middle" fill="#000000" font-size="11">Custom themes for terminal editors</text>
</svg>
