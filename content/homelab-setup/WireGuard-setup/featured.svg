<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#f8fafc" rx="16"/>

  <!-- Laptop -->
  <g transform="translate(200, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="95" rx="5" fill="url(#screenGrad)"/>
    <rect x="5" y="5" width="130" height="80" rx="3" fill="#0f172a"/>
    <text x="12" y="24" fill="#22c55e" font-size="9" font-family="monospace">$ ssh user@server</text>
    <text x="12" y="38" fill="#94a3b8" font-size="8" font-family="monospace">Connecting...</text>
    <text x="12" y="52" fill="#22c55e" font-size="8" font-family="monospace">Welcome to Debian!</text>
    <text x="12" y="66" fill="#94a3b8" font-size="9" font-family="monospace">user@server:~$</text>
    <rect x="112" y="58" width="7" height="10" fill="#22c55e" opacity="0.8"/>
    <rect x="-15" y="95" width="170" height="10" rx="3" fill="#94a3b8"/>
    <rect x="25" y="105" width="90" height="5" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- WireGuard Logo (above SSH) -->
  <g transform="translate(400, 95)">
    <g transform="translate(-20, -25) scale(0.0781)">
      <rect width="512" height="512" rx="15%" fill="#88171a"/>
      <path d="m238 53l35 8 0 2c-15 2-30-4-45-5 11 7 23 11 35 15-19 16-35-5-56 9 20 10 19 8 21 27-9 1-24 10-27 16 13 3 28 0 41 8-4 3-14 7-18 10 9 2 20-2 25 1 19 16 54 38 64 60 17 37-22 77-60 83-53 11-83 66-64 117 19 50 78 72 125 46 66-40 56-108 16-145-2-2-4-2-6 0-14 9-29 17-45 24 36 8 41 35 37 54-13 48-78 37-85-4-3-19 7-38 24-46 59-26 87-30 104-97 6-38-3-58-31-80-11-11-33-18-40-35-1-2 1-6 3-6 10-2 49-3 49-1 7 7 13-4 16-9-10-2-21-1-29-1-1 0-3-2-4-3 1-1 3-2 4-2h41c0-7-9-17-18-19v3c-8 1-16-1-24-4-4-3-7-9-11-11-16-9-33-16-54-16-10 0-17 1-23 1zm74 30l3 3-4 2c-2 1-3 0-4-1-2-3 4-5 5-4zm-120 96c-54 33-51 109-3 139 4 2 6 2 8-1 12-15 23-22 36-30-25-4-38-16-37-33-4-60 83-54 74 2-2 10-8 19-16 25 27-6 47-21 55-48 2-8 2-19-2-26-30-44-75-53-115-28zm-62 195c16-7 33-10 49-13 1-13 5-26 13-36-30 0-55 20-62 49z" fill="#ffffff"/>
    </g>
  </g>

  <!-- SSH Arrow -->
  <path d="M 360 150 L 470 150" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="135" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="700">SSH</text>
  <text x="405" y="178" text-anchor="middle" fill="#475569" font-size="13">Port 22</text>

  <!-- DuckDNS Logo (below Port 22) -->
  <g transform="translate(405, 200)">
    <g transform="translate(-18, 2) scale(0.0875)">
      <path d="M226.8 213.8c-15.5 0-51 7.5-63.8-.1-9.4-5.6-15.6-18.7-23.2-26.5-14.1-14.4-30.6-26.3-48.7-35.1-8.1-4-19.6-10.8-28.9-7.7-17.5 5.8-30.6 34.2-38.6 49.4-31.6 59.6-29.4 136.1-5.7 198 17.1 44.7 47.5 59.6 91.1 74.1 64.5 21.5 143.6 25.7 209.1 6.4 40.2-11.9 69.3-19.2 90.5-58.3 20.3-37.5 30.3-84.3 24.2-126.8-2.6-18.1-19.6-50-16.5-66.6 2.5-13.2 29.8-8.9 39.7-12.6 29.2-11.1 73.4-64.3 49-98-12.6-17.4-53.4 3.4-70.3-7.4-9.9-6.3-15.3-24.1-22.7-33.3-16.5-20.7-39.3-33.4-64.9-39.1C276.2 14.3 211 69.5 207 140.4c-1.5 27 9.5 49.4 19.8 73.4" fill="#040502"/>
      <path d="M304.7 54.7c-56.8 10.7-83.6 74.7-64.8 125.7 5 13.5 40.5 44.4 26.3 56.5-6.8 5.8-19.9 3.6-28.2 3.6-20.1-.2-39.9-1.8-60.1.6-11.1 1.3-23.6 5.8-32.5-3.4-18.3-18.7-28.6-40.4-52-54.9-6.8-4.2-17.9-12.5-26-7.5-14.3 8.9-23.7 34.5-29.4 49.6-17 44.8-14.2 97.2-.8 142.4 4.7 15.7 11 36.7 23.3 48.1 15.4 14.2 42 22.2 61.8 27.9 55.9 16.1 116.4 19.8 173.5 8 21.5-4.5 55.7-10.2 72.7-24.9 36.2-31.5 43.3-97.1 37.9-141.2-2.7-22.1-19-43.5-20.4-64.5-1.1-17.3 22-38.6 24.8-57.8 9-62.9-40.6-120.6-106.1-108.2" fill="#fcfc01"/>
      <path d="M340.3 95.3c-29.3 11.2-10 54.3 17.7 42.8 28.9-11.8 10.1-53.4-17.7-42.8" fill="#040502"/>
      <path d="M435.9 122.6c4.9 26.7-2.9 47.6-6.7 73.4 41-3.6 62.2-34.1 62.3-73.4z" fill="#fd0101"/>
    </g>
  </g>

  <!-- Server -->
  <g transform="translate(480, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="110" rx="6" fill="url(#serverGrad)"/>
    <rect x="6" y="6" width="108" height="22" rx="3" fill="#1e293b"/>
    <circle cx="18" cy="17" r="5" fill="#22c55e"/>
    <circle cx="33" cy="17" r="5" fill="#22c55e"/>
    <rect x="50" y="12" width="58" height="10" rx="2" fill="#0f172a"/>
    <rect x="6" y="34" width="108" height="14" rx="2" fill="#1e293b"/>
    <rect x="6" y="52" width="108" height="14" rx="2" fill="#1e293b"/>
    <rect x="6" y="70" width="108" height="14" rx="2" fill="#1e293b"/>
    <circle cx="100" cy="41" r="3" fill="#22c55e"/>
    <circle cx="100" cy="59" r="3" fill="#22c55e"/>
    <circle cx="100" cy="77" r="3" fill="#eab308"/>
    <text x="60" y="100" text-anchor="middle" fill="#94a3b8" font-size="12">Debian Server</text>
  </g>
</svg>