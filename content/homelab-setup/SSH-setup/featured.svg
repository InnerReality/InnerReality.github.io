<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc" rx="12"/>

  <!-- Row 1: Left to Right (y=115) -->
  <ellipse cx="80" cy="115" rx="50" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="120" text-anchor="middle" fill="#166534" font-size="14" font-weight="600">Start</text>

  <line x1="130" y1="115" x2="165" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="165" y="90" width="120" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="120" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="600">Set Root Pw</text>

  <line x1="285" y1="115" x2="320" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="320" y="90" width="120" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="120" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="600">Install SSH</text>

  <line x1="440" y1="115" x2="475" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="475" y="90" width="120" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="535" y="120" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="600">Enable Svc</text>

  <!-- Curve Row1 to Row2 -->
  <path d="M 595 115 Q 630 115, 630 150 Q 630 185, 595 185" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Row 2: Right to Left (y=185) -->
  <rect x="475" y="160" width="120" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="535" y="190" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="600">Connect</text>

  <line x1="475" y1="185" x2="440" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="320" y="160" width="120" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="190" text-anchor="middle" fill="#92400e" font-size="13" font-weight="600">Setup Sudo</text>

  <line x1="320" y1="185" x2="285" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="165" y="160" width="120" height="50" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="190" text-anchor="middle" fill="#9d174d" font-size="13" font-weight="600">Gen SSH Keys</text>

  <!-- Curve Row2 to Row3 -->
  <path d="M 165 185 Q 130 185, 130 220 Q 130 255, 165 255" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Row 3: Left to Right (y=255) -->
  <rect x="165" y="230" width="120" height="50" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="260" text-anchor="middle" fill="#9d174d" font-size="13" font-weight="600">Edit Config</text>

  <line x1="285" y1="255" x2="320" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="320" y="230" width="120" height="50" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="260" text-anchor="middle" fill="#9d174d" font-size="13" font-weight="600">Apply Key</text>

  <line x1="440" y1="255" x2="475" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="475" y="230" width="120" height="50" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="535" y="260" text-anchor="middle" fill="#9d174d" font-size="13" font-weight="600">Test Conn</text>

  <line x1="595" y1="255" x2="630" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <ellipse cx="680" cy="255" rx="45" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="260" text-anchor="middle" fill="#166534" font-size="14" font-weight="600">Done</text>
</svg>