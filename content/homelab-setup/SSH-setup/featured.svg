<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#f8fafc" rx="16"/>

  <!-- Laptop -->
  <g transform="translate(200, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="95" rx="5" fill="url(#screenGrad)"/>
    <rect x="5" y="5" width="130" height="80" rx="3" fill="#0f172a"/>
    <text x="12" y="24" fill="#22c55e" font-size="9" font-family="monospace">$ ssh user@server</text>
    <text x="12" y="38" fill="#94a3b8" font-size="8" font-family="monospace">Connecting...</text>
    <text x="12" y="52" fill="#22c55e" font-size="8" font-family="monospace">Welcome to Debian!</text>
    <text x="12" y="66" fill="#94a3b8" font-size="9" font-family="monospace">user@server:~$</text>
    <rect x="112" y="58" width="7" height="10" fill="#22c55e" opacity="0.8"/>
    <rect x="-15" y="95" width="170" height="10" rx="3" fill="#94a3b8"/>
    <rect x="25" y="105" width="90" height="5" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- SSH Arrow -->
  <path d="M 360 150 L 470 150" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="135" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="700">SSH</text>
  <text x="405" y="178" text-anchor="middle" fill="#475569" font-size="13">Port 22</text>

  <!-- Server -->
  <g transform="translate(480, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="110" rx="6" fill="url(#serverGrad)"/>
    <rect x="6" y="6" width="108" height="22" rx="3" fill="#1e293b"/>
    <circle cx="18" cy="17" r="5" fill="#22c55e"/>
    <circle cx="33" cy="17" r="5" fill="#22c55e"/>
    <rect x="50" y="12" width="58" height="10" rx="2" fill="#0f172a"/>
    <rect x="6" y="34" width="108" height="14" rx="2" fill="#1e293b"/>
    <rect x="6" y="52" width="108" height="14" rx="2" fill="#1e293b"/>
    <rect x="6" y="70" width="108" height="14" rx="2" fill="#1e293b"/>
    <circle cx="100" cy="41" r="3" fill="#22c55e"/>
    <circle cx="100" cy="59" r="3" fill="#22c55e"/>
    <circle cx="100" cy="77" r="3" fill="#eab308"/>
    <text x="60" y="100" text-anchor="middle" fill="#94a3b8" font-size="12">Debian Server</text>
  </g>
</svg>
