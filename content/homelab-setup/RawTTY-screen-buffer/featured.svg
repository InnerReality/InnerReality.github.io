<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#f8fafc" rx="8"/>

  <!-- === LEFT: Terminal showing the PROBLEM === -->
  <g transform="translate(200, 80)">
    <rect x="0" y="0" width="190" height="120" rx="6" fill="url(#terminalGrad)" filter="url(#shadow)"/>
    <!-- Title bar dots -->
    <circle cx="14" cy="12" r="4" fill="#ef4444"/>
    <circle cx="28" cy="12" r="4" fill="#eab308"/>
    <circle cx="42" cy="12" r="4" fill="#22c55e"/>
    <rect x="55" y="7" width="90" height="10" rx="3" fill="#334155"/>

    <!-- Shell prompt -->
    <text x="10" y="35" fill="#4ade80" font-size="10" font-family="monospace">$ vim file.txt</text>
    <text x="10" y="50" fill="#e2e8f0" font-size="10" font-family="monospace">editing...</text>

    <!-- Garbled output -->
    <text x="10" y="68" fill="#f87171" font-size="9" font-family="monospace">ESC[1;24rESC[?47h</text>
    <text x="10" y="82" fill="#fbbf24" font-size="9" font-family="monospace">▓▒░█▒▓░█▓▒░</text>
    <text x="10" y="96" fill="#f87171" font-size="9" font-family="monospace">ESC[?25lESC[2J</text>
    <text x="165" y="96" fill="#ef4444" font-size="18" font-weight="bold">✗</text>

    <!-- Label below -->
    <text x="95" y="138" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="600">Screen Garbled</text>
  </g>


  <!-- === RIGHT: Solution === -->
  <g transform="translate(410, 80)">
    <rect x="0" y="0" width="190" height="120" rx="6" fill="url(#terminalGrad)" filter="url(#shadow)"/>
    <!-- Title bar dots -->
    <circle cx="14" cy="12" r="4" fill="#ef4444"/>
    <circle cx="28" cy="12" r="4" fill="#eab308"/>
    <circle cx="42" cy="12" r="4" fill="#22c55e"/>
    <rect x="55" y="7" width="70" height="10" rx="3" fill="#334155"/>

    <text x="10" y="35" fill="#4ade80" font-size="10" font-family="monospace">$ export TERM=xfce</text>
    <text x="10" y="50" fill="#94a3b8" font-size="10" font-family="monospace">~/.bash_profile</text>

    <!-- Clean prompt -->
    <text x="10" y="70" fill="#4ade80" font-size="10" font-family="monospace">$ <tspan fill="#e2e8f0">vim file.txt</tspan></text>
    <text x="10" y="86" fill="#4ade80" font-size="10" font-family="monospace">$ <tspan fill="#e2e8f0">cursor here</tspan></text>
    <text x="10" y="102" fill="#4ade80" font-size="10" font-family="monospace">$ <tspan fill="#64748b">█</tspan></text>
    <text x="165" y="102" fill="#22c55e" font-size="18" font-weight="bold">✓</text>

    <!-- Label below -->
    <text x="95" y="138" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">TERM = xfce</text>
  </g>
</svg>
